// Son des minuteurs : le navigateur ne laisse jouer un son qu'après un toucher dans la page. On débloque donc le son à chaque toucher
// (sinon, après un rechargement de la page par l'appli Claude, le bip restait muet), et le bip passe en mode « lecture » pour sonner même iPhone en silencieux.
let actx=null;const tmAudio=()=>{try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state!=="running")actx.resume();

function costOf(id){let c=0;const miss=new Set();

    const p=ingPrice(name);if(p==null){miss.add(name);return;}c+=q*p;};
  itemsOf(id).forEach(i=>i.g?i.items.forEach(add):add(i));return {c,miss:[...miss]};}

  el.querySelectorAll("input[data-stock]").forEach(i=>{i.onfocus=()=>i.select();i.onchange=()=>{const v=+String(i.value).replace(",",".").replace(/\s/g,"");if(!isFinite(v)||v<0){renderOrder();return;}

  document.getElementById("copyOrder").onclick=async()=>{let ok=false;try{await navigator.clipboard.writeText(txt);ok=true;}catch(e){}

function openCal(){let m=parse(wk);m=new Date(m.getFullYear(),m.getMonth(),1);const o=document.createElement("div");o.className="askbg";const today=iso(new Date());
  const sel=dateOf(tab==="V"?sday:tab==="O"?oday:tab==="C"?cday:pday);
  const draw=()=>{const y=m.getFullYear(),mo=m.getMonth(),first=new Date(y,mo,1),start=new Date(y,mo,1-((first.getDay()+6)%7));
    let cells="";for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=iso(d),wd=WD[d.getDay()],inM=d.getMonth()===mo;
      if(i===35&&!inM)break;
      const tw=tuesdayOf(d)===wk&&wd,cl=["cd"];if(!inM)cl.push("om");if(!wd)cl.push("x");if(k===today)cl.push("td");if(tw)cl.push("wk");if(k===sel)cl.push("sel");if(wd&&offDay(k))cl.push("cl");
      const n=wd?orders.filter(x=>x.date===k&&!x.done).length:0,h=wd&&isHol(k);
      cells+=`<button class="${cl.join(" ")}" ${wd?`data-d="${k}"`:"disabled"}>${d.getDate()}${h?'<i class="hd"></i>':""}${n?`<b class="cb">${n}</b>`:""}</button>`;}
    o.innerHTML=`<div class="ask cal" role="dialog" aria-modal="true"><div class="calh"><button data-m="-1" aria-label="Mois précédent">‹</button><p>${MONTHS[mo][0].toUpperCase()+MONTHS[mo].slice(1)} ${y}</p><button data-m="1" aria-label="Mois suivant">›</button></div>
      <div class="calg">${["L","M","M","J","V","S","D"].map(x=>`<span>${x}</span>`).join("")}${cells}</div></div>`;};
  draw();document.body.appendChild(o);
  o.onclick=e=>{const b=e.target.closest("button");if(!b){if(e.target===o)o.remove();return;}
    if(b.dataset.m){m=new Date(m.getFullYear(),m.getMonth()+ +b.dataset.m,1);draw();return;}
    if(b.dataset.d){const k=b.dataset.d,wd=wdOf(k);wk=tuesdayOf(parse(k));
      if(tab==="V"){sday=wd;draft=null;}else if(tab==="O")oday=wd;else if(tab==="C")cday=wd;else pday=PDAYS.includes(wd)?wd:"Ven";

{const W=document.getElementById("week");let x0=null,y0=null;
