<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Vivant · Chiffre d'affaires</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#F2F2F7">
<style>
:root{--bg:#F2F2F7;--surface:#FFFFFF;--ink:#000000;--muted:#6C6C70;--line:rgba(60,60,67,.18);--acc:#B5651D;--acc-soft:rgba(181,101,29,.12);--fill:rgba(118,118,128,.12);--shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#000000;--surface:#1C1C1E;--ink:#FFFFFF;--muted:#98989F;--line:rgba(84,84,88,.6);--acc:#E0A060;--acc-soft:rgba(224,160,96,.16);--fill:rgba(118,118,128,.24);--shadow:none}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(48px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:12px;margin:8px 0 20px}
header img{width:44px;height:44px;border-radius:10px;box-shadow:var(--shadow)}
header h1{font-size:24px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.02em;flex:1}
header small{display:block;color:var(--muted);font-size:13px;font-weight:500;letter-spacing:0}
.btn{width:44px;height:44px;border-radius:22px;border:0;background:var(--surface);box-shadow:var(--shadow);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:0 0 auto}
.btn:disabled{opacity:.3;cursor:default}
.month{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.month b{font-size:20px;text-transform:capitalize}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.tile{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px}
.tile span{display:block;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.tile b{display:block;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
th,td{padding:9px 10px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;border-bottom:1px solid var(--line)}
tbody tr+tr td{border-top:1px solid var(--line)}
td.d{text-transform:capitalize}
tr.off td{color:var(--muted)}
tfoot td{font-weight:700;border-top:1px solid var(--line);background:var(--fill)}
.cut{display:none}
.msg{text-align:center;color:var(--muted);padding:80px 16px}
.msg svg{display:block;margin:0 auto 12px}
.upd{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}.cut{display:table-cell}.w{display:none}th,td{padding:9px 8px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="config.js"></script>
<script>
(()=>{
const app=document.getElementById("app");addEventListener("hashchange",()=>location.reload());
const IC={l:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6l6 6"/></svg>',
  r:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6l-6 6"/></svg>',
  dl:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M7 11l5 5l5-5"/><path d="M12 4v12"/></svg>',
  lock:'<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'};
const MONTHS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const DAYS=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const fmt=new Intl.NumberFormat("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
const eur=v=>fmt.format(v)+" €",eur0=v=>new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0}).format(v)+" €";
const r2=v=>Math.round(v*100)/100;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const token=decodeURIComponent((location.hash||"").slice(1));
const fail=()=>{app.innerHTML=`<div class="msg">${IC.lock}Lien inactif</div>`;};
const C=window.VIVANT_CONFIG||{};
if(token.length<32||!C.SB_URL){fail();return;}
let CA={},TVA=0.055,UPD=null,cur=null,months=[];
const day=k=>{const e=CA[k]||{};const cb=+e.cb||0,esp=+e.esp||0,closed=!!e.closed;const ttc=closed?0:r2(cb+esp);const ht=r2(ttc/(1+TVA));return {k,cb:closed?0:cb,esp:closed?0:esp,ttc,ht,tva:r2(ttc-ht),closed};};
const rows=m=>Object.keys(CA).filter(k=>k.startsWith(m)).sort().map(day).filter(d=>d.closed||d.ttc>0);
const sum=rs=>rs.reduce((s,d)=>({cb:s.cb+d.cb,esp:s.esp+d.esp,ttc:s.ttc+d.ttc,ht:s.ht+d.ht,tva:s.tva+d.tva,n:s.n+(d.ttc>0?1:0)}),{cb:0,esp:0,ttc:0,ht:0,tva:0,n:0});
const label=m=>{const [y,mm]=m.split("-");return MONTHS[+mm-1]+" "+y;};
function render(){
  const i=months.indexOf(cur),rs=rows(cur),t=sum(rs);
  app.innerHTML=`<header><img src="icon-180.png" alt=""><h1>Vivant<small>Chiffre d'affaires</small></h1><button class="btn" id="csv" aria-label="Exporter le mois en CSV" title="Exporter (CSV)">${IC.dl}</button></header>
  <div class="month"><button class="btn" id="prev" aria-label="Mois précédent" ${i<=0?"disabled":""}>${IC.l}</button><b>${label(cur)}</b><button class="btn" id="next" aria-label="Mois suivant" ${i>=months.length-1?"disabled":""}>${IC.r}</button></div>
  <div class="tiles"><div class="tile"><span>TTC</span><b>${eur0(t.ttc)}</b></div><div class="tile"><span>HT</span><b>${eur0(t.ht)}</b></div><div class="tile"><span>TVA ${fmt.format(TVA*100).replace(/,?0+$/,"")} %</span><b>${eur0(t.tva)}</b></div><div class="tile"><span>Jours</span><b>${t.n}</b></div></div>
  <div class="card"><table><thead><tr><th>Jour</th><th class="w">Carte</th><th class="w">Espèces</th><th>TTC</th><th>HT</th><th class="w">TVA</th></tr></thead><tbody>
  ${rs.map(d=>{const x=new Date(d.k+"T12:00:00");return d.closed?`<tr class="off"><td class="d">${DAYS[x.getDay()]} ${x.getDate()}</td><td colspan="5" style="text-align:center">fermé</td></tr>`
    :`<tr><td class="d">${DAYS[x.getDay()]} ${x.getDate()}</td><td class="w">${eur(d.cb)}</td><td class="w">${eur(d.esp)}</td><td>${eur(d.ttc)}</td><td>${eur(d.ht)}</td><td class="w">${eur(d.tva)}</td></tr>`;}).join("")||`<tr class="off"><td colspan="6" style="text-align:center">—</td></tr>`}
  </tbody><tfoot><tr><td>Total</td><td class="w">${eur(t.cb)}</td><td class="w">${eur(t.esp)}</td><td>${eur(t.ttc)}</td><td>${eur(t.ht)}</td><td class="w">${eur(t.tva)}</td></tr></tfoot></table></div>
  ${UPD?`<div class="upd">${esc(new Date(UPD).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}))}</div>`:""}`;
  document.getElementById("prev").onclick=()=>{if(i>0){cur=months[i-1];render();}};
  document.getElementById("next").onclick=()=>{if(i<months.length-1){cur=months[i+1];render();}};
  document.getElementById("csv").onclick=()=>csv(cur);
}
function csv(m){
  const n=v=>v.toFixed(2).replace(".",","),rs=rows(m),t=sum(rs);
  const L=["Date;Carte TTC;Espèces TTC;Total TTC;Total HT;TVA;Statut"];
  rs.forEach(d=>L.push([d.k.split("-").reverse().join("/"),n(d.cb),n(d.esp),n(d.ttc),n(d.ht),n(d.tva),d.closed?"fermé":"ouvert"].join(";")));
  L.push(["Total "+label(m),n(t.cb),n(t.esp),n(t.ttc),n(t.ht),n(t.tva),t.n+" jours"].join(";"));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+L.join("\r\n")+"\r\n"],{type:"text/csv;charset=utf-8"}));
  a.download="Vivant_CA_"+m+".csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
fetch(C.SB_URL+"/rest/v1/rpc/ca_compta",{method:"POST",headers:{"apikey":C.SB_KEY,"Authorization":"Bearer "+C.SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_token:token}),cache:"no-store"})
  .then(r=>r.ok?r.json():null).then(j=>{
    if(!j||!j.ca){fail();return;}
    TVA=+j.tva||0.055;UPD=j.updated_at;
    CA=j.ca;
    const today=new Date(),tm=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0");
    const ks=Object.keys(CA).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort();
    const first=(ks[0]||tm).slice(0,7);let [y,mm]=first.split("-").map(Number);months=[];
    for(;;){const m=y+"-"+String(mm).padStart(2,"0");if(m>tm)break;months.push(m);mm++;if(mm>12){mm=1;y++;}}
    cur=months[months.length-1];if(!rows(cur).length&&months.length>1&&today.getDate()<3)cur=months[months.length-2];
    render();
  }).catch(fail);
})();
</script>
</body>
</html>
