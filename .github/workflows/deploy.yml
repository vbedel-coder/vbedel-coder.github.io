# Installe ou met à jour la base Supabase et la sonnerie des minuteurs. Le site lui-même est servi par GitHub Pages depuis la branche main.
name: Supabase
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: supabase
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      API: https://api.supabase.com/v1
    steps:
      - uses: actions/checkout@v4
      - name: Jeton présent
        run: test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Secret SUPABASE_ACCESS_TOKEN manquant"; exit 1; }
      - name: Projet Supabase
        run: |
          P=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" $API/projects)
          REF=$(echo "$P" | jq -r '[.[]|select(.name|ascii_downcase|startswith("vivant"))][0].id // empty')
          [ -n "$REF" ] || REF=$(echo "$P" | jq -r 'if length==1 then .[0].id else empty end')
          [ -n "$REF" ] || { echo "::error::Aucun projet Supabase « Vivant »"; exit 1; }
          echo "REF=$REF" >> $GITHUB_ENV
      - name: Base de données
        run: |
          sed "s/__REF__/$REF/g" supabase/setup.sql | jq -Rs '{query:.}' > q.json
          curl -fsS -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @q.json $API/projects/$REF/database/query
      - name: Connexion par e-mail et mot de passe (inscription fermée dès que le compte existe)
        run: |
          N=$(jq -n '{query:"select count(*)::int as n from auth.users"}' | curl -fsS -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @- $API/projects/$REF/database/query | jq '.[0].n')
          jq -n --argjson closed "$([ "$N" -gt 0 ] && echo true || echo false)" '{site_url:"https://vbedel-coder.github.io",mailer_autoconfirm:true,disable_signup:$closed}' > a.json
          C=$(curl -sS -o r.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @a.json $API/projects/$REF/config/auth)
          [ "${C:0:1}" = "2" ] || { echo "HTTP $C"; cat r.json; exit 1; }
          echo "Comptes : $N"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Clés des notifications (créées une seule fois)
        run: |
          q() { jq -n --arg s "$1" '{query:$s}' | curl -fsS -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @- $API/projects/$REF/database/query; }
          HAS=$(q "select v from public.config where k='vapid_public'" | jq 'length')
          if [ "$HAS" = "0" ] || ! supabase secrets list --project-ref $REF | grep -q VAPID_PRIVATE; then
            K=$(npx -y web-push@3.6.7 generate-vapid-keys --json)
            PUB=$(echo "$K" | jq -r .publicKey); PRIV=$(echo "$K" | jq -r .privateKey); echo "::add-mask::$PRIV"
            supabase secrets set --project-ref $REF VAPID_PUBLIC="$PUB" VAPID_PRIVATE="$PRIV"
            q "insert into public.config(k,v) values('vapid_public','$PUB') on conflict(k) do update set v=excluded.v" > /dev/null
          fi
      - name: Sonnerie des minuteurs
        run: supabase functions deploy timers --project-ref $REF --no-verify-jwt --use-api
      - name: Adresse et clé publique pour l'appli
        run: |
          KEY=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$API/projects/$REF/api-keys" | jq -r '([.[]|select(.name=="anon")][0].api_key) // ([.[]|select(.type=="publishable")][0].api_key)')
          printf 'window.VIVANT_CONFIG={SB_URL:"https://%s.supabase.co",SB_KEY:"%s"};\n' "$REF" "$KEY" > config.js
          if ! git diff --quiet config.js; then
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Adresse du projet Supabase" config.js && git push
          fi
